name: Derleme ve test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test FotoDuzenleyici.sln -c Release

  # Setup.exe'yi derler, bu makinede sessizce kurup denetler, kaldırır; Setup.exe'yi yapıt olarak ekler.
  kurulum:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Zip ve Setup.exe'yi derle
        run: ./publish.ps1
      - name: Kur, denetle, kaldır
        run: ./installer/test-install.ps1 (Get-ChildItem dist -Filter 'FotoDuzenleyici-Setup-*.exe' | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: dist/FotoDuzenleyici-Setup-*.exe
          retention-days: 14

  # Sürüm etiketi (ör. v0.1.3) gönderilince zip'i ve Setup.exe'yi derleyip GitHub sürümüne ekler.
  release:
    needs: [test, kurulum]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Zip ve Setup.exe'yi derle
        run: ./publish.ps1
      - name: Sürüm notunu CHANGELOG'dan çıkar
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($ver))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md içinde [$ver] bölümü yok" }
          $body = $lines[$start..($lines.Count - 1)] | ForEach-Object -Begin { $stop = $false } -Process {
            if ($_ -match '^## \[' -or $_ -match '^\[.+\]: ') { $stop = $true }
            if (-not $stop) { $_ }
          }
          $body | Set-Content notes.md -Encoding utf8
      - name: Sürümü yayınla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @('dist/FotoDuzenleyici-win-x64.zip') + @(Get-ChildItem dist -Filter 'FotoDuzenleyici-Setup-*.exe' | ForEach-Object FullName)
          if ($files.Count -lt 2) { throw 'Setup.exe derlenmedi' }
          # Sürüm elle açılmışsa yalnızca dosyalar güncellenir.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @files --clobber }
          else { gh release create $tag @files --title $tag --notes-file notes.md }
