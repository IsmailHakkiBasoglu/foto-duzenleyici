name: Derleme ve test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test FotoDuzenleyici.sln -c Release

  # Sürüm etiketi (ör. v0.1.3) gönderilince zip'i derleyip GitHub sürümüne ekler.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Zip'i derle
        run: ./publish.ps1
      - name: Sürüm notunu CHANGELOG'dan çıkar
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($ver))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md içinde [$ver] bölümü yok" }
          $body = $lines[$start..($lines.Count - 1)] | ForEach-Object -Begin { $stop = $false } -Process {
            if ($_ -match '^## \[' -or $_ -match '^\[.+\]: ') { $stop = $true }
            if (-not $stop) { $_ }
          }
          $body | Set-Content notes.md -Encoding utf8
      - name: Sürümü yayınla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = 'dist/FotoDuzenleyici-win-x64.zip'
          # Sürüm elle açılmışsa yalnızca zip güncellenir.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $zip --clobber }
          else { gh release create $tag $zip --title $tag --notes-file notes.md }
